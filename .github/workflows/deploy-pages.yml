name: 发布斗罗人生模拟器

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 读取代码
        uses: actions/checkout@v4
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 构建短地址版本
        env:
          VITE_AI_ENDPOINT: https://douluo-life-simulator.fendou913006836.chatgpt.site/api/ai/generate
        run: npm run build:pages
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 上传页面产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 发布公网页面
        id: deployment
        uses: actions/deploy-pages@v4
